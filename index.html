<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>न रा का स कोषिकोड</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100vh;
    font-family: 'Segoe UI', 'Noto Sans Devanagari', Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  }
  .header {
    text-align: center;
    padding: 25px 15px 15px;
    color: #fff;
  }
  .header h1 {
    margin: 0;
    font-size: 2.2rem;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.35);
    letter-spacing: 1px;
  }
  .header p {
    margin: 6px 0 0;
    font-size: 0.95rem;
    opacity: 0.85;
  }
  .frame-wrap {
    max-width: 750px;
    margin: 0 auto 30px;
    padding: 0 15px;
  }
  iframe {
    width: 100%;
    height: 900px;
    border: none;
    border-radius: 16px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.35);
    background: #fff;
    display: block;
  }
  @media (max-width: 600px) {
    iframe { height: 1100px; }
    .header h1 { font-size: 1.6rem; }
  }
</style>
</head>
<body>

  <div class="header">
    
  </div>

  <div class="frame-wrap">
    <iframe
      src="https://script.google.com/macros/s/AKfycbxY-9DCz4kpwpxWCUs6TtPPDpPnc_kY4w5zb1uLCGYN2GjX30OSDwZG2IUEUaH0xnLfTg/exec"
      title="न रा का स कोषीकोड App"
      allow="clipboard-read; clipboard-write">
    </iframe>
  </div>

</body>
</html>
